name: CI

on:
  push:
    branches:
      - main
      - 'v*'
  pull_request: {}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    env:
      CI: 'true'

    steps:
      - uses: actions/checkout@v4
      # Must precede setup-node: `cache: pnpm` resolves the pnpm store path,
      # which requires pnpm to already be on PATH. Version comes from the root
      # package.json `packageManager` field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Compile TypeScript
        run: pnpm compile
      # - name: Lint
      #   run: pnpm lint
      - name: Test @docfy/core
        run: pnpm --filter @docfy/core test
      - name: Test @docfy/ember-vite
        run: pnpm --filter @docfy/ember-vite test
      - name: Test @docfy/plugin-with-prose
        run: pnpm --filter @docfy/plugin-with-prose test
      - name: Test @docfy/plugin-shiki
        run: pnpm --filter @docfy/plugin-shiki test

      # Passing unit tests are not enough to know the integrations work. A
      # failure inside the markdown pipeline used to be swallowed, producing a
      # *successful* build whose Docfy output had fallen back to its empty
      # structure — an app with no routes at all, and green CI. Build both
      # integrations and assert the output is real.
      - name: Build test-app-vite
        run: pnpm --filter test-app-vite run build
      - name: Assert Docfy generated routes
        run: |
          if ! grep -q '"children":\[{"name":"docs"' test-app-vite/dist/assets/*.js; then
            echo "::error::Docfy generated no routes. The virtual output module fell back to its empty structure, which means markdown processing failed."
            exit 1
          fi
      # These .gjs files are generated by @docfy/ember-vite but committed, so a
      # diff here means rendered markdown output changed. Expected to move when
      # docs or the pipeline change — regenerate and commit them in that case.
      - name: Assert generated templates are up to date
        run: git diff --exit-code -- test-app-vite/app/templates
      - name: Build test-app-classic
        run: pnpm --filter test-app-classic run build
